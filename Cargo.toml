[package]
name = "langfuse-rust-sdk"
version = "0.10.2"
edition = "2024"
description = "Rust SDK for the Langfuse LLM observability API"
license = "MIT"
repository = "https://github.com/lep511/langfuse-rust-sdk"
homepage = "https://github.com/lep511/langfuse-rust-sdk"
documentation = "https://docs.rs/langfuse-rust-sdk"
readme = "README.md"
keywords = ["langfuse", "llm", "observability", "tracing", "sdk"]
categories = ["api-bindings", "development-tools"]
# Development-only Cargo settings (aliases) are not part of the package.
exclude = [".cargo/"]

[workspace]
# `integration-tests` (unpublished) holds the tests and examples that need rig
# or the AWS SDK with an HTTP client: `cargo test` of this crate, and the
# trybuild project built from its dev-dependencies, never compile them.
members = ["macros", "integration-tests"]

[dependencies]
langfuse-rust-sdk-macros = { version = "=0.10.2", path = "macros", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
tracing = "0.1"
url = "2"
serde_urlencoded = "0.7"
percent-encoding = "2"
serde_norway = "0.9"
sha2 = "0.11.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"], optional = true }
# `otel`: gzip compression of OTLP exports (reqwest's `gzip` feature only decodes responses).
flate2 = { version = "1", optional = true }
# `tracing-layer`: the `tracing-opentelemetry` release built on `opentelemetry` 0.33.
tracing-opentelemetry = { version = "0.34", default-features = false, optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"], optional = true }
# `openai`: the async-openai API changes between 0.x versions, so the minor version is fixed.
async-openai = { version = "0.43", default-features = false, features = ["rustls", "chat-completion", "embedding", "responses"], optional = true }
# `bedrock`: traced Converse calls through the AWS SDK; the HTTP client and
# runtime features are the application's choice.
aws-sdk-bedrockruntime = { version = "1.153", default-features = false, optional = true }
# `bedrock`: the `Document` type of tool inputs and model fields (not re-exported by the SDK).
aws-smithy-types = { version = "1.9", default-features = false, optional = true }

[package.metadata.docs.rs]
# Document the `otel` and `unstable` modules too.
all-features = true

[features]
unstable = []
# Native tracing on OpenTelemetry: observations, context propagation and batched export.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:flate2", "tokio/sync"]
# Bridge from the `tracing` crate (`otel::tracing_layer`), e.g. for rig's `gen_ai.*` spans.
tracing-layer = ["otel", "dep:tracing-opentelemetry", "dep:tracing-subscriber"]
# The `#[observe]` attribute (`langfuse_rust_sdk::observe`).
macros = ["otel", "dep:langfuse-rust-sdk-macros"]
# Traced OpenAI calls through async-openai (`openai::OpenAI`).
openai = ["otel", "dep:async-openai"]
# Traced Amazon Bedrock Converse calls through aws-sdk-bedrockruntime (`bedrock::Bedrock`).
bedrock = ["otel", "dep:aws-sdk-bedrockruntime", "dep:aws-smithy-types"]
# Blocking client on an internal Tokio runtime (`blocking::LangfuseClient`).
blocking = ["tokio/rt-multi-thread"]

# Dev-dependencies are compiled for every `cargo test`, whatever the features,
# and trybuild copies all of them into its project: heavy crates used by
# feature-gated tests (rig, aws-config, the AWS SDK's default features) belong
# in `integration-tests/`.
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
dotenvy = "0.15"
wiremock = "0.6"
futures = "0.3.34"
trybuild = "1"

[[example]]
name = "dashboards"
required-features = ["unstable"]

[[example]]
name = "otel_tracing"
required-features = ["otel"]

[[example]]
name = "otel_export_options"
required-features = ["otel"]

[[example]]
name = "media"
required-features = ["otel"]

[[example]]
name = "run_experiment"
required-features = ["otel"]

[[example]]
name = "observe"
required-features = ["macros"]

[[example]]
name = "openai_tracing"
required-features = ["openai"]

[[example]]
name = "blocking"
required-features = ["blocking"]

# Development builds carry no debuginfo: it made up ~95% of every test and
# example binary (236 MB -> 10 MB each) and `target/` grew past 50 GB.
# Panic messages keep their file:line; backtrace frames keep their names but
# lose file:line. For a debugging session, opt back in with
# `CARGO_PROFILE_DEV_DEBUG=line-tables-only` (or `full`). `cargo test` uses
# the `test` profile, which inherits these settings. See docs/build-footprint.md.
[profile.dev]
debug = false
