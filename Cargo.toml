[package]
name = "langfuse-rust-sdk"
version = "0.7.0"
edition = "2024"
description = "Rust SDK for the Langfuse LLM observability API"
license = "MIT"
repository = "https://github.com/lep511/langfuse-rust-sdk"
homepage = "https://github.com/lep511/langfuse-rust-sdk"
documentation = "https://docs.rs/langfuse-rust-sdk"
readme = "README.md"
keywords = ["langfuse", "llm", "observability", "tracing", "sdk"]
categories = ["api-bindings", "development-tools"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
tracing = "0.1"
url = "2"
percent-encoding = "2"
serde_norway = "0.9"
sha2 = "0.11.1"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"], optional = true }

[package.metadata.docs.rs]
# Document the `otel` and `unstable` modules too.
all-features = true

[features]
unstable = []
# Native tracing on OpenTelemetry: observations, context propagation and batched export.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "tokio/sync"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
dotenvy = "0.15"
wiremock = "0.6"
futures = "0.3.34"

[[example]]
name = "dashboards"
required-features = ["unstable"]

[[example]]
name = "otel_tracing"
required-features = ["otel"]

[[example]]
name = "media"
required-features = ["otel"]

[[example]]
name = "run_experiment"
required-features = ["otel"]
